name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract latest changelog entry
        id: changelog
        run: |
          version="$(python .github/scripts/extract_changelog.py)"
          if [ -z "$version" ]; then
            echo "No released version section found in CHANGELOG.md; skipping."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        if: steps.changelog.outputs.version != ''
        run: |
          tag="v${{ steps.changelog.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            echo "Tag $tag already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.changelog.outputs.version != '' && steps.tag_check.outputs.exists == 'false'
        run: |
          tag="v${{ steps.changelog.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Publish GitHub release
        if: steps.changelog.outputs.version != '' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: v${{ steps.changelog.outputs.version }}
          body_path: release_notes.md
